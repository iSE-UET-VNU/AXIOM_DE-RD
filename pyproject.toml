[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-de-rd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "datalab-python-sdk",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "Markdown>=3.0",
    # Corpus fetchers read the benchmark's parquet and pull its PDFs from the hub.
    "huggingface_hub>=0.23",
    "numpy>=1.26",
    "openai>=1.0.0",
    "pyarrow>=14.0",
    # Module name is pytrec_eval; without it run_retrieval reports ndcg@10 as
    # null with a note rather than failing, so a run looks complete and scores
    # nothing.
    "pytrec_eval-terrier>=0.5.10",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "PyMuPDF>=1.24.0",
    "python-pptx>=1.0.0,<2.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "streamlit[pdf]>=1.49.0",
    # Exact token counts when batching embedding requests. Without it the
    # embedders fall back to an upper-bound estimate: correct, but it sends
    # smaller batches than necessary.
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.30.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
lift = ["datalab-python-sdk"]
chandra2 = ["chandra-ocr>=0.2,<0.3"]
chandra2-local = ["chandra-ocr[hf]>=0.2,<0.3"]
pdf-inspector = ["pdf-inspector>=0.2.6,<0.3"]

[tool.setuptools.package-data]
"src.ingestion.parsing.lift" = ["schemas/*.json"]
