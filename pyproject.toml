[project]
name = "axiom-de-rd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "openpyxl>=3.1,<4",
    "pymilvus>=2.4.0",
    "python-dotenv>=1.0.0",
    "xlrd>=2.0,<3",
]

[project.optional-dependencies]
lift = ["datalab-python-sdk"]
chandra2 = ["chandra-ocr>=0.2,<0.3"]
chandra2-local = ["chandra-ocr[hf]>=0.2,<0.3"]

[tool.setuptools.package-data]
"src.storage.schemas" = ["*.json"]
"src.ingestion.parsing.lift" = ["schemas/*.json"]
