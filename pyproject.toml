[project]
name = "axiom-de-rd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datalab-python-sdk",
    "openai>=1.0.0",
    "pymilvus>=2.4.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.package-data]
"src.storage.schemas" = ["*.json"]
"src.ingestion.parsing.lift" = ["schemas/*.json"]
