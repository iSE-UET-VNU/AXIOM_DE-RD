[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-de-rd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "datalab-python-sdk",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0,<2.0.0",
    "python-docx>=1.2.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit[pdf]>=1.49.0",
    "uvicorn[standard]>=0.30.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
lift = ["datalab-python-sdk"]
chandra2 = ["chandra-ocr>=0.2,<0.3"]
chandra2-local = ["chandra-ocr[hf]>=0.2,<0.3"]

[tool.setuptools.package-data]
"src.ingestion.parsing.lift" = ["schemas/*.json"]
