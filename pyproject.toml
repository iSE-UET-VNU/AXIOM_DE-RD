[project]
name = "axiom-de-rd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "datalab-python-sdk",
    "fastapi>=0.115.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit[pdf]>=1.49.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.package-data]
"src.ingestion.parsing.lift" = ["schemas/*.json"]
