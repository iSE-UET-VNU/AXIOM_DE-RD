{
  "input_dir": "data/raw/final_test",
  "processed_dir": "data/processed/final_test",
  "cleaned_dir": "data/cleaned/final_test",
  "enriched_dir": "data/enriched/final_test",
  "output_dir": "data/output/final_test",
  "enabled_modules": [
    "ingestion",
    "cleaning",
    "enrichment",
    "indexing_cataloging",
    "integration",
    "storage"
  ],
  "parsing": {
    "provider": "lift_api",
    "lift_api": {
      "api_key_env": "DATALAB_API_KEY",
      "mode": "balanced",
      "schema_path": "src/ingestion/parsing/lift/schemas/document_components.json",
      "output_dir": "data/processed/final_test/lift_outputs",
      "fallback_to_local": false
    }
  },
  "indexing": {
    "embeddings": {
      "enabled": true,
      "target_index_types": [
        "text_chunk"
      ],
      "provider": "openrouter",
      "model": "openai/text-embedding-3-small",
      "dimension": 1536,
      "batch_size": 32,
      "fail_on_error": true,
      "api_key_env": "OPENROUTER_API_KEY",
      "app_title": "AXIOM_DE-RD"
    }
  },
  "storage": {
    "mode": "local",
    "local": {
      "artifacts_dir": "data/output/final_test"
    },
    "vector_db": {
      "provider": "milvus",
      "uri": "",
      "token_env": "MILVUS_TOKEN",
      "collection_name": "axiom_text_chunks_openrouter_text_embedding_3_small_1536",
      "drop_collection": false,
      "metric_type": "COSINE"
    }
  },
  "logging": {
    "level": "INFO"
  }
}
