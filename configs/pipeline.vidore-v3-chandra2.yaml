{
  "input": {
    "mode": "local_raw"
  },
  "local_input": {
    "path": "data/raw/benchmarks/vidore_v3",
    "recursive": true,
    "include_hidden": false,
    "include_extensions": [
      ".pdf"
    ],
    "max_files": null
  },
  "raw_dir": "data/raw",
  "ingested_dir": "data/ingested/benchmarks/vidore-v3-chandra2",
  "cleaned_dir": "data/cleaned/benchmarks/vidore-v3-chandra2",
  "enriched_dir": "data/enriched/benchmarks/vidore-v3-chandra2",
  "embedded_dir": "data/embedded/benchmarks/vidore-v3-chandra2",
  "output_dir": "data/output/benchmarks/vidore-v3-chandra2",
  "enabled_modules": [
    "ingestion",
    "cleaning",
    "enrichment",
    "chunking_embedding",
    "integration",
    "artifacts"
  ],
  "parsing": {
    "provider": "chandra2",
    "chandra2": {
      "method": "vllm",
      "continuous_page_queue": true,
      "max_workers": 256,
      "render_processes": 32,
      "request_batch_size": 1,
      "request_timeout_seconds": 3600,
      "max_output_tokens": 12384,
      "max_retries": 2,
      "include_images": true,
      "include_headers_footers": true,
      "save_raw_outputs": true,
      "refine_tables": false,
      "output_dir": "data/work/benchmarks/vidore-v3-chandra2"
    }
  },
  "chunking_embedding": {
    "chunker": "fixed_overlap",
    "chunker_params": {
      "n_words": 512,
      "overlap": 128
    },
    "max_rows_per_chunk": 20,
    "embedder": "openrouter_te3s",
    "embedder_params": {
      "model": "openai/text-embedding-3-small",
      "dimension": 1536,
      "api_key_env": "OPENROUTER_API_KEY",
      "batch_size": 64,
      "cache_dir": "data/work/embedding_cache/text-embedding-3-small",
      "app_title": "AXIOM_DE-RD"
    },
    "retrieval_profile": "hybrid_default"
  },
  "logging": {
    "level": "INFO"
  }
}
