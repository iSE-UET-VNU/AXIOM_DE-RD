{
  "input": {
    "mode": "local_raw"
  },
  "local_input": {
    "path": "data/raw/parser-smoke",
    "recursive": true,
    "include_hidden": false,
    "include_extensions": [
      ".pdf",
      ".png",
      ".jpg",
      ".jpeg"
    ],
    "max_files": null
  },
  "raw_dir": "data/raw",
  "ingested_dir": "data/ingested",
  "cleaned_dir": "data/cleaned",
  "enriched_dir": "data/enriched",
  "embedded_dir": "data/embedded",
  "output_dir": "data/output",
  "enabled_modules": [
    "ingestion",
    "cleaning",
    "enrichment",
    "indexing_cataloging",
    "integration",
    "artifacts"
  ],
  "parsing": {
    "provider": "lift_api",
    "lift_api": {
      "api_key_env": "DATALAB_API_KEY",
      "mode": "accurate",
      "schema_path": "src/ingestion/parsing/lift/schemas/document_components.json",
      "fallback_to_local": false,
      "extract_images": true,
      "save_raw_outputs": false
    }
  },
  "indexing": {
    "embeddings": {
      "enabled": true,
      "target_index_types": [
        "text_chunk",
        "table",
        "image"
      ],
      "provider": "local_hash",
      "model": "local-hash-embedding-v1",
      "dimension": 256,
      "batch_size": 32,
      "fail_on_error": true
    }
  },
  "logging": {
    "level": "INFO"
  }
}
