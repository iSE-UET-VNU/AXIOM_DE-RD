{
  "input": {
    "mode": "local_raw"
  },
  "local_input": {
    "path": "data/raw/benchmarks/vidore_v3",
    "recursive": true,
    "include_hidden": false,
    "include_extensions": [
      ".pdf"
    ],
    "max_files": null
  },
  "raw_dir": "data/raw",
  "ingested_dir": "data/ingested/benchmarks/vidore-v3-kdl",
  "cleaned_dir": "data/cleaned/benchmarks/vidore-v3-kdl",
  "enriched_dir": "data/enriched/benchmarks/vidore-v3-kdl",
  "embedded_dir": "data/embedded/benchmarks/vidore-v3-kdl",
  "output_dir": "data/output/benchmarks/vidore-v3-kdl",
  "enabled_modules": [
    "ingestion",
    "cleaning",
    "enrichment",
    "chunking_embedding",
    "integration",
    "artifacts"
  ],
  "parsing": {
    "provider": "kdl",
    "kdl": {
      "endpoint_url": "http://127.0.0.1:8000/v1",
      "model": "kdl-frontier-parser-nano",
      "continuous_page_queue": true,
      "max_workers": 64,
      "render_processes": 32,
      "bbox_max_workers": 256,
      "dpi": 144,
      "request_timeout_seconds": 3600,
      "max_retries": 2,
      "max_pages": 400,
      "layout_max_output_tokens": 6000,
      "text_max_output_tokens": 2048,
      "table_max_output_tokens": 5500,
      "picture_max_output_tokens": 4096,
      "formula_max_output_tokens": 128,
      "save_raw_outputs": true,
      "output_dir": "data/work/benchmarks/vidore-v3-kdl"
    }
  },
  "chunking_embedding": {
    "chunker": "fixed_overlap",
    "chunker_params": {
      "n_words": 512,
      "overlap": 128
    },
    "max_rows_per_chunk": 20,
    "embedder": "openrouter_te3s",
    "embedder_params": {
      "model": "openai/text-embedding-3-small",
      "dimension": 1536,
      "api_key_env": "OPENROUTER_API_KEY",
      "batch_size": 64,
      "cache_dir": "data/work/embedding_cache/text-embedding-3-small",
      "app_title": "AXIOM_DE-RD"
    },
    "retrieval_profile": "hybrid_default"
  },
  "logging": {
    "level": "INFO"
  }
}
