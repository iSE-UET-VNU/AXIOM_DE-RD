<div id="ranked-score-debugger">
  <style>
    #ranked-score-debugger { color: var(--foreground); font-family: ui-sans-serif, system-ui, sans-serif; }
    #ranked-score-debugger * { box-sizing: border-box; }
    #ranked-score-debugger h2, #ranked-score-debugger h3, #ranked-score-debugger p { margin: 0; }
    #ranked-score-debugger h2 { margin-bottom: 4px; }
    #ranked-score-debugger .text-muted { color: var(--muted-foreground); }
    #ranked-score-debugger .viz-controls { margin: 14px 0; }
    #ranked-score-debugger .form-label { display: grid; gap: 5px; min-width: min(100%, 440px); }
    #ranked-score-debugger .form-select { max-width: 100%; }
    #ranked-score-debugger .chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
    #ranked-score-debugger .chart-wide { grid-column: 1 / -1; }
    #ranked-score-debugger .raw-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    #ranked-score-debugger figure { margin: 0; min-width: 0; }
    #ranked-score-debugger figcaption { margin-bottom: 6px; }
    #ranked-score-debugger .chart-title { font-weight: 500; }
    #ranked-score-debugger .chart-note { color: var(--muted-foreground); font-size: 12px; margin-top: 2px; }
    #ranked-score-debugger svg { display: block; width: 100%; min-height: 290px; overflow: visible; }
    #ranked-score-debugger .legend { display: flex; flex-wrap: wrap; gap: 12px; color: var(--muted-foreground); font-size: 12px; margin: 5px 0 2px; }
    #ranked-score-debugger .legend span::before { content: ''; display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; background: currentColor; }
    #ranked-score-debugger .bm { color: var(--orange); }
    #ranked-score-debugger .dense { color: var(--blue); }
    #ranked-score-debugger .gold { color: var(--green); }
    #ranked-score-debugger .physics { color: var(--purple); }
    #ranked-score-debugger .industrial { color: var(--red); }
    #ranked-score-debugger .ohr { color: var(--green); }
    #ranked-score-debugger .query-text { margin: 12px 0 6px; line-height: 1.45; }
    #ranked-score-debugger .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    #ranked-score-debugger .summary .card { padding: 10px; }
    #ranked-score-debugger .summary b { display: block; font-size: 18px; font-weight: 500; }
    #ranked-score-debugger .summary span { display: block; color: var(--muted-foreground); font-size: 12px; }
    #ranked-score-debugger .gold-ranks { margin-top: 12px; font-size: 13px; line-height: 1.55; }
    #ranked-score-debugger .gold-ranks code { font-size: 12px; }
    #ranked-score-debugger .axis text { fill: var(--muted-foreground); font-size: 12px; }
    #ranked-score-debugger .axis path, #ranked-score-debugger .axis line { stroke: var(--border); }
    #ranked-score-debugger .axis-title { fill: var(--foreground); font-size: 12px; }
    @media (max-width: 700px) { #ranked-score-debugger .chart-grid { grid-template-columns: 1fr; } #ranked-score-debugger .chart-wide { grid-column: auto; } #ranked-score-debugger .summary { grid-template-columns: 1fr; } #ranked-score-debugger .raw-pair { grid-template-columns: 1fr; } }
  </style>
  <h2>Score debugger: BM25 ↔ dense embedding</h2>
  <p class="text-muted">Score trên mỗi đường đều đã chia cho score lớn nhất của chính query. Mục tiêu: quan sát độ rơi theo rank, không suy luận cutoff từ histogram toàn corpus.</p>
  <div class="viz-controls" aria-label="Chọn query để phân tích">
    <label class="form-label">Query
      <select id="rsd-select" class="form-select" aria-label="Query cần phân tích"></select>
    </label>
    <button id="rsd-prev" class="btn" type="button">← Trước</button>
    <button id="rsd-next" class="btn" type="button">Sau →</button>
  </div>
  <div class="chart-grid">
    <figure>
      <figcaption><div class="chart-title">220 query: median score theo rank</div><div class="chart-note">Band = p25–p75. Các vạch đứng là rank 10 và 20.</div></figcaption>
      <div class="legend"><span class="bm">BM25</span><span class="dense">Dense</span></div>
      <svg id="rsd-global" role="img" aria-label="Median score by global rank across all queries"></svg>
    </figure>
    <figure>
      <figcaption><div class="chart-title">Query được chọn: score curve 1–30</div><div class="chart-note">Marker xanh: gold page xuất hiện trong top-30 của signal tương ứng.</div></figcaption>
      <div class="legend"><span class="bm">BM25</span><span class="dense">Dense</span><span class="gold">Gold evidence</span></div>
      <svg id="rsd-query" role="img" aria-label="Selected query score by rank"></svg>
    </figure>
    <figure class="chart-wide">
      <figcaption><div class="chart-title">Raw score: toàn bộ 220 query</div><div class="chart-note">Median và p25–p75 theo rank; hai panel giữ nguyên đơn vị gốc, không ép BM25 và dense vào cùng thang.</div></figcaption>
      <div class="raw-pair"><div><div class="legend"><span class="bm">BM25 raw</span></div><svg id="rsd-raw-global-bm" role="img" aria-label="Global raw BM25 score by rank"></svg></div><div><div class="legend"><span class="dense">Dense raw</span></div><svg id="rsd-raw-global-dense" role="img" aria-label="Global raw dense score by rank"></svg></div></div>
    </figure>
    <figure class="chart-wide">
      <figcaption><div class="chart-title">Raw score: query được chọn</div><div class="chart-note">Đây là đường raw thật của từng page; marker gold cho biết evidence nằm ở đâu.</div></figcaption>
      <div class="raw-pair"><div><div class="legend"><span class="bm">BM25 raw</span><span class="gold">Gold evidence</span></div><svg id="rsd-raw-query-bm" role="img" aria-label="Selected query raw BM25 score by rank"></svg></div><div><div class="legend"><span class="dense">Dense raw</span><span class="gold">Gold evidence</span></div><svg id="rsd-raw-query-dense" role="img" aria-label="Selected query raw dense score by rank"></svg></div></div>
    </figure>
    <figure class="chart-wide">
      <figcaption><div class="chart-title">Bản đồ outlier: độ rơi score ở rank 20</div><div class="chart-note">Gần 0 = score rơi mạnh sau top page; gần 1 = score mịn/không có breakpoint rõ. Click điểm để chọn query.</div></figcaption>
      <div class="legend"><span class="physics">Physics</span><span class="industrial">Industrial</span><span class="ohr">OHR</span></div>
      <svg id="rsd-outliers" role="img" aria-label="Outlier map score drop at rank 20"></svg>
    </figure>
  </div>
  <hr>
  <div id="rsd-detail" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    const scoreData = __SCORE_DATA__;
    (() => {
      const root = document.getElementById('ranked-score-debugger');
      const select = root.querySelector('#rsd-select');
      const colours = { bm: 'var(--orange)', dense: 'var(--blue)', gold: 'var(--green)', physics: 'var(--purple)', industrial: 'var(--red)', ohr: 'var(--green)' };
      const queries = scoreData.queries;
      const label = q => `${q.dataset.toUpperCase()} · ${q.query_id}${q.outlier ? ` · ${q.outlier}` : ''}`;
      queries.forEach((q, index) => select.add(new Option(label(q), index)));
      select.value = String(scoreData.defaultIndex);
      const getSvg = id => d3.select(root.querySelector(id));
      const dimensions = svg => { const w = Math.max(330, svg.node().clientWidth || 520); const h = 290; svg.attr('viewBox', `0 0 ${w} ${h}`).selectAll('*').remove(); return { w, h, m: { t: 16, r: 18, b: 46, l: 66 } }; };
      const frame = (svg, d, x, y, xlabel, ylabel) => {
        const { w, h, m } = d; const iw = w - m.l - m.r, ih = h - m.t - m.b;
        svg.append('rect').attr('data-chart-frame', '').attr('x', m.l).attr('y', m.t).attr('width', iw).attr('height', ih).attr('fill', 'none').attr('stroke', 'var(--border)');
        svg.append('g').attr('class', 'axis').attr('transform', `translate(0,${m.t + ih})`).call(d3.axisBottom(x).ticks(w < 450 ? 4 : 6));
        svg.append('g').attr('class', 'axis').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5));
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x').attr('x', m.l + iw / 2).attr('y', h - 5).attr('text-anchor', 'middle').text(xlabel);
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('transform', `translate(15,${m.t + ih / 2}) rotate(-90)`).attr('text-anchor', 'middle').text(ylabel);
      };
      const thresholds = (svg, d, x) => { const { m, h } = d; [10, 20].forEach(rank => svg.append('line').attr('x1', x(rank)).attr('x2', x(rank)).attr('y1', m.t).attr('y2', h - m.b).attr('stroke', 'var(--border)').attr('stroke-dasharray', '3,3')); };
      const drawGlobal = () => {
        const svg = getSvg('#rsd-global'); const d = dimensions(svg); const { w, h, m } = d; const x = d3.scaleLinear().domain([1, 30]).range([m.l, w - m.r]); const y = d3.scaleLinear().domain([0, 1]).range([h - m.b, m.t]);
        frame(svg, d, x, y, 'Rank trong corpus', 'Score / max score'); thresholds(svg, d, x);
        const area = band => d3.area().x((v, i) => x(i + 1)).y0(v => y(v[0])).y1(v => y(v[2]))(band); const line = band => d3.line().x((v, i) => x(i + 1)).y(v => y(v[1]))(band);
        [['bm', scoreData.globalBm], ['dense', scoreData.globalDense]].forEach(([key, band]) => { svg.append('path').attr('d', area(band)).attr('fill', colours[key]).attr('opacity', .14); svg.append('path').attr('d', line(band)).attr('fill', 'none').attr('stroke', colours[key]).attr('stroke-width', 2); });
      };
      const drawSelected = q => {
        const svg = getSvg('#rsd-query'); const d = dimensions(svg); const { w, h, m } = d; const x = d3.scaleLinear().domain([1, 30]).range([m.l, w - m.r]); const y = d3.scaleLinear().domain([0, 1]).range([h - m.b, m.t]);
        frame(svg, d, x, y, 'Rank trong corpus', 'Score / max score'); thresholds(svg, d, x);
        const line = arr => d3.line().x((v, i) => x(i + 1)).y(v => y(v))(arr);
        [['bm', q.bmCurve], ['dense', q.denseCurve]].forEach(([key, curve]) => svg.append('path').attr('d', line(curve)).attr('fill', 'none').attr('stroke', colours[key]).attr('stroke-width', 2));
        [['bm', q.bmGold], ['dense', q.denseGold]].forEach(([key, gold]) => svg.append('g').selectAll(`.gold-${key}`).data(gold.filter(v => v.rank <= 30)).join('circle').attr('cx', v => x(v.rank)).attr('cy', v => y(v.score)).attr('r', 4).attr('fill', 'var(--background)').attr('stroke', colours.gold).attr('stroke-width', 2).append('title').text(v => `${key.toUpperCase()} rank ${v.rank}: ${v.page_id}`));
      };
      const drawRawCurve = (selector, curve, gold, colour, ylabel, isDense) => {
        const svg = getSvg(selector); const d = dimensions(svg); const { w, h, m } = d; const max = Math.max(...curve, 0); const min = Math.min(...curve, 0); const pad = Math.max((max - min) * .06, Math.abs(max) * .04, .001); const x = d3.scaleLinear().domain([1, 30]).range([m.l, w - m.r]); const y = d3.scaleLinear().domain([min - pad, max + pad]).range([h - m.b, m.t]);
        frame(svg, d, x, y, 'Rank trong corpus', ylabel); thresholds(svg, d, x);
        svg.append('path').attr('d', d3.line().x((v, i) => x(i + 1)).y(v => y(v))(curve)).attr('fill', 'none').attr('stroke', colour).attr('stroke-width', 2);
        svg.append('g').selectAll('circle').data(gold.filter(v => v.rank <= 30)).join('circle').attr('class', 'cursor-interaction').attr('cx', v => x(v.rank)).attr('cy', v => y(v.raw)).attr('r', 4).attr('fill', 'var(--background)').attr('stroke', 'var(--green)').attr('stroke-width', 2).attr('data-tooltip', v => `${isDense ? 'Dense' : 'BM25'} raw rank ${v.rank}: ${v.raw.toFixed(5)}\n${v.page_id}`);
      };
      const drawRawGlobal = (selector, band, colour, ylabel) => {
        const svg = getSvg(selector); const d = dimensions(svg); const { w, h, m } = d; const values = band.flat(); const min = Math.min(...values, 0); const max = Math.max(...values); const pad = Math.max((max - min) * .06, Math.abs(max) * .04, .001); const x = d3.scaleLinear().domain([1, 30]).range([m.l, w - m.r]); const y = d3.scaleLinear().domain([min - pad, max + pad]).range([h - m.b, m.t]);
        frame(svg, d, x, y, 'Rank trong corpus', ylabel); thresholds(svg, d, x);
        const area = d3.area().x((v, i) => x(i + 1)).y0(v => y(v[0])).y1(v => y(v[2]))(band); const line = d3.line().x((v, i) => x(i + 1)).y(v => y(v[1]))(band);
        svg.append('path').attr('d', area).attr('fill', colour).attr('opacity', .14); svg.append('path').attr('d', line).attr('fill', 'none').attr('stroke', colour).attr('stroke-width', 2);
      };
      const drawOutliers = () => {
        const svg = getSvg('#rsd-outliers'); const d = dimensions(svg); const { w, h, m } = d; const x = d3.scaleLinear().domain([0, 1]).range([m.l, w - m.r]); const y = d3.scaleLinear().domain([0, 1]).range([h - m.b, m.t]);
        frame(svg, d, x, y, 'BM25 score rank 20 / top-1', 'Dense score rank 20 / top-1');
        svg.append('g').selectAll('circle').data(queries).join('circle').attr('class', 'cursor-interaction').attr('cx', q => x(q.bmAt20)).attr('cy', q => y(q.denseAt20)).attr('r', 5).attr('fill', q => colours[q.dataset]).attr('opacity', .78).attr('data-tooltip', q => `${label(q)}\nBM25@20/top1: ${q.bmAt20.toFixed(3)} · Dense@20/top1: ${q.denseAt20.toFixed(3)}`).on('click', (_, q) => { select.value = String(queries.indexOf(q)); update(); });
      };
      const ranks = (items, name) => items.length ? items.map(v => `<code>${name} ${v.rank}</code>`).join(', ') : `<span class="text-muted">không có gold page trong ${name}</span>`;
      const update = () => {
        const q = queries[Number(select.value)]; drawSelected(q); drawRawCurve('#rsd-raw-query-bm', q.bmRawCurve, q.bmGold, colours.bm, 'BM25 raw score', false); drawRawCurve('#rsd-raw-query-dense', q.denseRawCurve, q.denseGold, colours.dense, 'Dense raw score', true);
        root.querySelector('#rsd-detail').innerHTML = `<p class="query-text"><b>${q.dataset.toUpperCase()}</b> · ${q.query}</p><div class="summary"><div class="card"><b>${q.goldCount}</b><span>Gold page</span></div><div class="card"><b>${q.bmRawMax.toFixed(3)}</b><span>BM25 raw max</span></div><div class="card"><b>${q.denseRawMax.toFixed(4)}</b><span>Dense raw max</span></div></div><div class="gold-ranks"><b>Gold ranks trong toàn corpus</b><br>BM25: ${ranks(q.bmGold, 'r')}<br>Dense: ${ranks(q.denseGold, 'r')}<br>Hybrid candidate: ${ranks(q.hybridGold, 'r')}<br>Hybrid top-20: ${ranks(q.returnedGold, 'r')}</div>`;
      };
      drawGlobal(); drawRawGlobal('#rsd-raw-global-bm', scoreData.globalRawBm, colours.bm, 'BM25 raw score'); drawRawGlobal('#rsd-raw-global-dense', scoreData.globalRawDense, colours.dense, 'Dense raw score'); drawOutliers(); update();
      select.addEventListener('change', update);
      root.querySelector('#rsd-prev').addEventListener('click', () => { select.value = String((Number(select.value) + queries.length - 1) % queries.length); update(); });
      root.querySelector('#rsd-next').addEventListener('click', () => { select.value = String((Number(select.value) + 1) % queries.length); update(); });
      new ResizeObserver(() => { drawGlobal(); drawRawGlobal('#rsd-raw-global-bm', scoreData.globalRawBm, colours.bm, 'BM25 raw score'); drawRawGlobal('#rsd-raw-global-dense', scoreData.globalRawDense, colours.dense, 'Dense raw score'); drawOutliers(); update(); }).observe(root);
    })();
  </script>
</div>
